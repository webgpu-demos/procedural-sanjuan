<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedural San Juan</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1220; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px; max-width: calc(100vw - 48px);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: #e8ecf2;
        background: rgba(10, 14, 22, 0.66); border-radius: 6px; pointer-events: none; white-space: pre-wrap;
      }
      @media (max-width: 700px) { #hud { top: 46px; } } /* (below the settings panel's bar on a phone) */
      #credits {
        position: fixed; right: 8px; bottom: 6px; font: 11px system-ui, sans-serif; color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 2px #000;
      }
      /* shown while a city loads: at start-up and when another city is chosen */
      #loader {
        position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 62%, #0f4c5c 0%, #0a2433 55%, #050d14 100%); color: #fff8ee;
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; transition: opacity 0.7s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .jp { font-size: 15px; letter-spacing: 0.6em; color: #5fe0d0; text-shadow: 0 0 12px #2ab7a9; }
      #loader .city { font-size: clamp(34px, 6vw, 68px); font-weight: 800; letter-spacing: 0.04em; text-shadow: 0 0 18px #ff7a45, 0 0 46px #f2c94c; }
      #loader .bar { width: min(420px, 60vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #loader .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2ab7a9, #f2c94c, #ff7a45); box-shadow: 0 0 12px #ff7a45; transition: width 0.25s ease; }
      #loader .step { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: rgba(244, 248, 255, 0.6); min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="jp">PUERTO RICO</div>
      <div class="city"></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="step">starting…</div>
    </div>
    <script>
      // The city's name goes on the loading screen before anything else runs, so it never changes under the eye.
      (function () {
        var id = new URLSearchParams(location.search).get('area') || 'viejosanjuan', name = null;
        try { name = localStorage.getItem('procedural-sanjuan:name:' + id); } catch (e) {}
        var known = { viejosanjuan: 'Old San Juan', condado: 'Condado', hatorey: 'Hato Rey (Milla de Oro)', sanjuan: 'San Juan' };
        document.querySelector('#loader .city').textContent = name || known[id] || id.charAt(0).toUpperCase() + id.slice(1);
      })();
    </script>
    <div id="hud">loading…</div>
    <div id="credits"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
