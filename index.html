<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedural San Juan</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1220; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 10px 12px; max-width: calc(100vw - 48px);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; color: #e8ecf2;
        background: rgba(10, 14, 22, 0.66); border-radius: 6px; pointer-events: none; white-space: pre-wrap;
      }
      @media (max-width: 700px) { #hud { top: 46px; } } /* (below the settings panel's bar on a phone) */
      #toast {
        position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 8px); z-index: 1020; max-width: calc(100vw - 32px);
        padding: 8px 14px; border-radius: 6px; background: rgba(10, 14, 22, 0.88); color: #e8ecf2; font: 13px system-ui, sans-serif;
        opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; overflow-wrap: anywhere;
      }
      #toast.on { opacity: 1; transform: translate(-50%, 0); }
      /* data sources: a button at the bottom left (it carries the OpenStreetMap attribution) that opens the list above it */
      #sources {
        position: fixed; left: 8px; bottom: 8px; z-index: 1010; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
        max-width: min(430px, calc(100vw - 16px)); font: 12px/1.45 system-ui, -apple-system, sans-serif; color: #e8ecf2;
      }
      #sources-toggle {
        appearance: none; border: 0; cursor: pointer; padding: 5px 10px; border-radius: 6px; max-width: 100%; text-align: left;
        background: rgba(10, 14, 22, 0.66); color: inherit; font: inherit;
      }
      #sources-toggle:hover { background: rgba(10, 14, 22, 0.85); }
      #sources-toggle:focus-visible { outline: 2px solid #5fe0d0; outline-offset: 2px; }
      #sources-toggle .chev { display: inline-block; transition: transform 0.15s ease; }
      #sources-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
      #sources-toggle .osm { color: rgba(232, 236, 242, 0.7); }
      #sources-list {
        max-height: min(62vh, 560px); overflow-y: auto; padding: 12px 14px; border-radius: 8px;
        background: rgba(10, 14, 22, 0.88); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      #sources-list[hidden] { display: none; }
      #sources-list h2 { font-size: 13px; margin: 0 0 4px; }
      #sources-list h3 { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #9fb0c4; margin: 12px 0 5px; }
      #sources-list ul { list-style: none; margin: 0; padding: 0; }
      #sources-list li { margin: 0 0 9px; }
      #sources-list p { margin: 2px 0 0; }
      #sources-list a { color: #7fd8ff; text-decoration: none; }
      #sources-list a:hover { text-decoration: underline; }
      #sources-list li > a { font-weight: 600; }
      #sources-list .meta, #sources-list .generated, #sources-list .compiled { color: #9fb0c4; font-size: 11px; }
      #sources-list .generated { margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.12); padding-top: 8px; }
      /* shown while a city loads: at start-up and when another city is chosen */
      #loader {
        position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 62%, #0f4c5c 0%, #0a2433 55%, #050d14 100%); color: #fff8ee;
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; transition: opacity 0.7s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .jp { font-size: 15px; letter-spacing: 0.6em; color: #5fe0d0; text-shadow: 0 0 12px #2ab7a9; }
      #loader .city { font-size: clamp(34px, 6vw, 68px); font-weight: 800; letter-spacing: 0.04em; text-shadow: 0 0 18px #ff7a45, 0 0 46px #f2c94c; }
      #loader .bar { width: min(420px, 60vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      #loader .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2ab7a9, #f2c94c, #ff7a45); box-shadow: 0 0 12px #ff7a45; transition: width 0.25s ease; }
      #loader .step { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: rgba(244, 248, 255, 0.6); min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="jp">PUERTO RICO</div>
      <div class="city"></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="step">starting…</div>
    </div>
    <script>
      // The city's name goes on the loading screen before anything else runs, so it never changes under the eye.
      (function () {
        var id = new URLSearchParams(location.search).get('area') || 'sanjuan', name = null;
        if (id === 'viejosanjuan') id = 'sanjuan'; // (see src/main.js)
        try { name = localStorage.getItem('procedural-sanjuan:name:' + id); } catch (e) {}
        var known = { sanjuan: 'San Juan', condado: 'Condado', hatorey: 'Hato Rey (Milla de Oro)' };
        document.querySelector('#loader .city').textContent = known[id] || name || id.charAt(0).toUpperCase() + id.slice(1);
      })();
    </script>
    <div id="hud">loading…</div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="sources">
      <div id="sources-list" role="region" aria-label="Data sources" hidden></div>
      <button id="sources-toggle" type="button" aria-expanded="false" aria-controls="sources-list"><span class="chev" aria-hidden="true">▴</span> Data sources <span class="osm">· © OpenStreetMap contributors</span></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
