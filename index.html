<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Procedural San Juan</title>
    <style>html,body{background:#0c1220;height:100%;margin:0;overflow:hidden}canvas{display:block}#hud{color:#e8ecf2;pointer-events:none;white-space:pre-wrap;background:#0a0e16a8;border-radius:6px;max-width:calc(100vw - 48px);padding:10px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;position:fixed;top:12px;left:12px}@media (max-width:700px){#hud{top:46px}}#toast{z-index:1020;color:#e8ecf2;opacity:0;pointer-events:none;overflow-wrap:anywhere;background:#0a0e16e0;border-radius:6px;max-width:calc(100vw - 32px);padding:8px 14px;font:13px system-ui,sans-serif;transition:opacity .2s,transform .2s;position:fixed;bottom:24px;left:50%;transform:translate(-50%,8px)}#toast.on{opacity:1;transform:translate(-50%)}#sources{z-index:1010;color:#e8ecf2;flex-direction:column;align-items:flex-start;gap:6px;max-width:min(430px,100vw - 16px);font:12px/1.45 system-ui,-apple-system,sans-serif;display:flex;position:fixed;bottom:8px;left:8px}#sources-toggle{appearance:none;cursor:pointer;text-align:left;max-width:100%;color:inherit;font:inherit;background:#0a0e16a8;border:0;border-radius:6px;padding:5px 10px}#sources-toggle:hover{background:#0a0e16d9}#sources-toggle:focus-visible{outline-offset:2px;outline:2px solid #5fe0d0}#sources-toggle .chev{transition:transform .15s;display:inline-block}#sources-toggle[aria-expanded=true] .chev{transform:rotate(180deg)}#sources-toggle .osm{color:#e8ecf2b3}#sources-list{background:#0a0e16e0;border-radius:8px;max-height:min(62vh,560px);padding:12px 14px;overflow-y:auto;box-shadow:0 6px 24px #00000059}#sources-list[hidden]{display:none}#sources-list h2{margin:0 0 4px;font-size:13px}#sources-list h3{text-transform:uppercase;letter-spacing:.07em;color:#9fb0c4;margin:12px 0 5px;font-size:10.5px;font-weight:600}#sources-list ul{margin:0;padding:0;list-style:none}#sources-list li{margin:0 0 9px}#sources-list p{margin:2px 0 0}#sources-list a{color:#7fd8ff;text-decoration:none}#sources-list a:hover{text-decoration:underline}#sources-list li>a{font-weight:600}#sources-list .meta,#sources-list .generated,#sources-list .compiled{color:#9fb0c4;font-size:11px}#sources-list .generated{border-top:1px solid #ffffff1f;margin-top:10px;padding-top:8px}#loader{z-index:100000;color:#fff8ee;background:radial-gradient(at 50% 62%,#0f4c5c 0%,#0a2433 55%,#050d14 100%);flex-direction:column;justify-content:center;align-items:center;gap:18px;font-family:Avenir Next,Segoe UI,system-ui,sans-serif;transition:opacity .7s;display:flex;position:fixed;inset:0}#loader.done{opacity:0;pointer-events:none}#loader .jp{letter-spacing:.6em;color:#5fe0d0;text-shadow:0 0 12px #2ab7a9;font-size:15px}#loader .city{letter-spacing:.04em;text-shadow:0 0 18px #ff7a45,0 0 46px #f2c94c;font-size:clamp(34px,6vw,68px);font-weight:800}#loader .bar{background:#ffffff1f;border-radius:2px;width:min(420px,60vw);height:4px;overflow:hidden}#loader .fill{background:linear-gradient(90deg,#2ab7a9,#f2c94c,#ff7a45);width:0%;height:100%;transition:width .25s;box-shadow:0 0 12px #ff7a45}#loader .step{color:#f4f8ff99;min-height:1.4em;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}</style>
    <script type="module" crossorigin src="./assets/index-DIQRFqgU.js"></script>
  </head>
  <body>
    <div id="loader">
      <div class="jp">PUERTO RICO</div>
      <div class="city"></div>
      <div class="bar"><div class="fill"></div></div>
      <div class="step">starting…</div>
    </div>
    <script>
      // The city's name goes on the loading screen before anything else runs, so it never changes under the eye.
      (function () {
        var id = new URLSearchParams(location.search).get('area') || 'sanjuan', name = null;
        if (id === 'viejosanjuan') id = 'sanjuan'; // (see src/main.js)
        try { name = localStorage.getItem('procedural-sanjuan:name:' + id); } catch (e) {}
        var known = { sanjuan: 'San Juan', condado: 'Condado', hatorey: 'Hato Rey (Milla de Oro)' };
        document.querySelector('#loader .city').textContent = known[id] || name || id.charAt(0).toUpperCase() + id.slice(1);
      })();
    </script>
    <div id="hud">loading…</div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="sources">
      <div id="sources-list" role="region" aria-label="Data sources" hidden></div>
      <button id="sources-toggle" type="button" aria-expanded="false" aria-controls="sources-list"><span class="chev" aria-hidden="true">▴</span> Data sources <span class="osm">· © OpenStreetMap contributors</span></button>
    </div>
  </body>
</html>
